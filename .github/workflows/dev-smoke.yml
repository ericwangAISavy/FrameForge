name: Development server smoke test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  dev-server:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:dev
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dev-traces-${{ matrix.os }}
          path: test-results/
          retention-days: 7
